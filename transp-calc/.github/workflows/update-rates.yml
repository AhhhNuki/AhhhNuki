name: Auto Update Forwarder Rates

on:
  schedule:
    # Runs daily at 06:00 UTC (10:00 Tbilisi time)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  check-and-update-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Scraper
        run: node scripts/scrape-rates.js

      - name: Commit and push changes if rates changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Rate Bot]"
          if [ -n "$(git status --porcelain data/forwarders.json)" ]; then
            echo "Changes detected in data/forwarders.json. Committing and pushing..."
            git add data/forwarders.json
            git commit -m "🤖 Auto-update forwarder rates [skip ci]"
            git push
          else
            echo "No changes in data/forwarders.json. Nothing to commit."
          fi
